services:

  server01:
    build:
      context: ..
      dockerfile: docker/dockerfile
    ports:
      - "8000:8000"
  
  server02:
    build:
      context: ..
      dockerfile: docker/dockerfile
    ports:
      - "8001:8000"

  server03:
    build:
      context: ..
      dockerfile: docker/dockerfile
    ports:
      - "8002:8000"

  load_balancer:
    build:
      context: ..
      dockerfile: docker/dockerfile
    command: python load_balance.py
    ports:
      - "8080:8080"
    depends_on:
      - server01
      - server02
      - server03